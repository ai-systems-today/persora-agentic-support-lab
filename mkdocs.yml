site_name: Persora Enterprise Agent Reliability Manual
site_description: A learner-oriented manual for grounded, measurable and inspectable enterprise AI agents.
site_url: https://ai-systems-today.github.io/persora-agentic-support-lab/docs/
repo_url: https://github.com/ai-systems-today/persora-agentic-support-lab
repo_name: ai-systems-today/persora-agentic-support-lab
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  logo: /persora-agentic-support-lab/persora-heart.png
  favicon: /persora-agentic-support-lab/persora-heart.png
  language: en
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: slate
      primary: custom
      accent: custom

nav:
  - Start:
      - Welcome: README.md
      - How to use this manual: LEARNING_PATH.md
      - Philosophy and evidence: PHILOSOPHY.md
      - Terminology and glossary: GLOSSARY.md
  - System:
      - Architecture: ARCHITECTURE.md
      - Technology stack: TECH_STACK.md
      - Request lifecycle: LIFECYCLE.md
      - Orchestration: ORCHESTRATION.md
      - Interaction protocols: PROTOCOLS.md
      - Explain this answer: EXPLAIN.md
      - Hybrid RAG cloud view: HYBRID_RAG.md
  - Reliability:
      - Grounding and RAG: GROUNDING.md
      - Quality and evaluation: QUALITY.md
      - Observability: OBSERVABILITY.md
      - Security and public safety: PUBLIC_SAFETY.md
  - Decisions and operations:
      - Technology decisions: TECHNOLOGY_DECISIONS.md
      - Milvus for enterprise workloads: MILVUS_ENTERPRISE.md
      - Operations and validation: OPERATIONS.md
      - Interview demonstration: INTERVIEW_DEMO.md
      - Implementation reference: IMPLEMENTATION_REFERENCE.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

extra_css:
  - assets/stylesheets/extra.css

copyright: Persora · Evidence before claims
